name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt native dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install Qt integration dependency
        run: python -m pip install PyQt6
      - name: Verify Qt integration prerequisites
        env:
          QT_QPA_PLATFORM: offscreen
          TALK2AI_REQUIRE_QT_TESTS: "1"
        run: |
          python - <<'PY'
          import traceback
          try:
              from PyQt6.QtCore import QFileSystemWatcher
              from PyQt6.QtWidgets import QApplication
              app = QApplication([])
              watcher = QFileSystemWatcher()
              app.processEvents()
              assert watcher is not None
          except BaseException:
              traceback.print_exc()
              raise
          PY
      - name: Bash syntax
        run: bash -n install.sh scripts/talk2ai-daemon scripts/talk2ai-handler scripts/talk2ai-keys scripts/talk2ai-control
      - name: Python syntax
        run: python -m py_compile scripts/talk2ai-tts scripts/talk2ai-tray scripts/talk2ai-keys scripts/talk2ai-tts-kokoro tests/*.py
      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          TALK2AI_REQUIRE_QT_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Qt integration stress (20 runs)
        env:
          QT_QPA_PLATFORM: offscreen
          TALK2AI_REQUIRE_QT_TESTS: "1"
        run: |
          for run in $(seq 1 20); do
            python -m unittest tests.test_tray_qt -v
          done
